  name: LIFT Aircraft Site MCP
  description: The public Model Context Protocol endpoint served by LIFT Aircraft's
    Wix-hosted site. Exposes nine tools that let an agent read business details, search
    the site, read the installed Wix business-solution API docs, open an anonymous
    visitor session, and act on a visitor's behalf — querying site data, booking a
    flight session, or starting a purchase. No authentication is required to connect;
    only public site information is reachable, and checkout completes on the website.
