aid: lift
name: LIFT Aircraft
description: LIFT Aircraft is an Austin, Texas experiential aviation company founded
  by former Boeing engineer Matt Chasen, built around HEXA — an amphibious electric
  vertical take-off and landing aircraft with eighteen independent electric motors
  and propellers, a 432lb carbon fibre airframe, a triply redundant autopilot flown
  with a single three-axis joystick, an autonomous ballistic parachute, and enough
  redundancy to fly and land safely with up to six motors disabled. Because HEXA is
  compliant with the FAA's powered ultralight classification, no pilot's licence is
  required, and LIFT sells flight as a paid experience rather than selling aircraft
  — a short training session followed by a solo flight from waterfront bases in Austin
  and other US cities. The company has raised over $25 million from venture capital,
  accredited investors and US government grants, has worked with the US Air Force
  Agility Prime programme and the US Army, and has begun the FAA type certification
  process for a commercial edition. LIFT publishes no developer REST API or OpenAPI;
  its only machine-readable surface is a live, unauthenticated Model Context Protocol
  endpoint and an llms.txt served by its Wix-hosted site.
